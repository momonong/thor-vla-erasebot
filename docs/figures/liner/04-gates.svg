<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700">
<title>開發關卡：先確認能操作，再驗證學習價值</title><desc>階段提案，不代表本隊已入選、預約設備或完成任一實機關卡。；概念規劃示意，非實機結果。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52778d"/></marker></defs>
<rect width="1320" height="700" fill="white"/><g font-family="Noto Sans CJK TC, sans-serif">
<text x="45" y="58" font-size="34" fill="#173042" text-anchor="start">開發關卡：先確認能操作，再驗證學習價值</text><text x="45" y="98" font-size="21" fill="#546772" text-anchor="start">階段提案，不代表本隊已入選、預約設備或完成任一實機關卡。</text><rect x="45" y="160" width="285" height="205" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="65" y="196" font-size="25" fill="#173042" text-anchor="start">G1 機械可行性</text><text x="65" y="235" font-size="20" fill="#173042" text-anchor="start">抓邊、提拉、放下</text><text x="65" y="265" font-size="20" fill="#173042" text-anchor="start">獨立重設與失敗紀錄</text><path d="M335,260 L339.0,260.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M350,260 L339.0,265.0 L339.0,255.0 Z" fill="#52778d"/><rect x="360" y="160" width="285" height="205" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="380" y="196" font-size="25" fill="#173042" text-anchor="start">G2 真實資料</text><text x="380" y="235" font-size="20" fill="#173042" text-anchor="start">相機／關節契約</text><text x="380" y="265" font-size="20" fill="#173042" text-anchor="start">示範、切分與檢查</text><path d="M650,260 L654.0,260.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M665,260 L654.0,265.0 L654.0,255.0 Z" fill="#52778d"/><rect x="675" y="160" width="285" height="205" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="695" y="196" font-size="25" fill="#173042" text-anchor="start">G3 學習與對照</text><text x="695" y="235" font-size="20" fill="#173042" text-anchor="start">有限ACT診斷</text><text x="695" y="265" font-size="20" fill="#173042" text-anchor="start">三方法同條件比較</text><path d="M965,260 L969.0,260.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M980,260 L969.0,265.0 L969.0,255.0 Z" fill="#52778d"/><rect x="990" y="160" width="285" height="205" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="1010" y="196" font-size="25" fill="#173042" text-anchor="start">G4 部署與展示</text><text x="1010" y="235" font-size="20" fill="#173042" text-anchor="start">Thor輸出一致性</text><text x="1010" y="265" font-size="20" fill="#173042" text-anchor="start">延遲、紀錄與重複展示</text><rect x="45" y="435" width="1230" height="145" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="65" y="471" font-size="25" fill="#173042" text-anchor="start">前置條件未滿足就保留未完成</text><text x="65" y="510" font-size="20" fill="#173042" text-anchor="start">先確認設備與現場條件；機械未通過不直接投入訓練。工作坊、設備時段與資源皆需另行確認。</text><text x="65" y="540" font-size="20" fill="#173042" text-anchor="start">官方節點：11/19初選結果 → 11/26工作坊 → 11/27–12/06備賽 → 12/08測試 → 12/09決賽</text>
<text x="45" y="666" font-size="18" fill="#6f4e29" text-anchor="start">研究規劃／概念示意；材料、尺寸、動作與設備時段仍須驗證。非照片、非物理模擬、非實機結果。</text>
</g></svg>