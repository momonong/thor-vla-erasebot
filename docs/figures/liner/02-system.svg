<text x="45" y="58" font-size="34" fill="#173042" text-anchor="start">系統分工：訓練、推論、操作與驗證</text><text x="45" y="98" font-size="21" fill="#546772" text-anchor="start">架構規劃；目前完成離線評分與批次報告，尚無策略訓練、硬體閉迴路或Thor部署成果。</text><rect x="45" y="145" width="370" height="385" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="65" y="181" font-size="25" fill="#173042" text-anchor="start">工作站：開發與資料</text><text x="65" y="220" font-size="20" fill="#173042" text-anchor="start">真實示範／場次分組</text><text x="65" y="250" font-size="20" fill="#173042" text-anchor="start">資料整理、訓練與驗證</text><text x="65" y="280" font-size="20" fill="#173042" text-anchor="start">固定策略與前後處理</text><text x="65" y="310" font-size="20" fill="#173042" text-anchor="start">CPU準備 ≠ CUDA訓練完成</text><rect x="510" y="145" width="330" height="165" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="530" y="181" font-size="25" fill="#173042" text-anchor="start">Thor：部署候選</text><text x="530" y="220" font-size="20" fill="#173042" text-anchor="start">相機影像＋關節狀態</text><text x="530" y="250" font-size="20" fill="#173042" text-anchor="start">ACT輸出短段動作</text><rect x="925" y="145" width="350" height="165" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="945" y="181" font-size="25" fill="#173042" text-anchor="start">操作邊界與執行</text><text x="945" y="220" font-size="20" fill="#173042" text-anchor="start">檢查時效、範圍與指令</text><text x="945" y="250" font-size="20" fill="#173042" text-anchor="start">SO-101執行後重新觀察</text><rect x="510" y="400" width="765" height="165" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="530" y="436" font-size="25" fill="#173042" text-anchor="start">結果檢查與證據</text><text x="530" y="475" font-size="20" fill="#173042" text-anchor="start">coverage／IoU＋獨立摺角證據＋時間與介入紀錄</text><text x="530" y="505" font-size="20" fill="#173042" text-anchor="start">達標停止；失敗有限修正；未知不當成功</text><path d="M425,225 L489.0,225.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M500,225 L489.0,230.0 L489.0,220.0 Z" fill="#52778d"/><path d="M850,225 L904.0,225.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M915,225 L904.0,230.0 L904.0,220.0 Z" fill="#52778d"/><path d="M1095,320 L1095.0,379.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M1095,390 L1090.0,379.0 L1100.0,379.0 Z" fill="#52778d"/><path d="M675,390 L675.0,331.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M675,320 L680.0,331.0 L670.0,331.0 Z" fill="#52778d"/><text x="438" y="202" font-size="16" fill="#173042" text-anchor="start">模型／設定</text><text x="690" y="361" font-size="19" fill="#173042" text-anchor="start">再觀察</text>
<text x="45" y="666" font-size="18" fill="#6f4e29" text-anchor="start">研究規劃／概念示意；材料、尺寸、動作與設備時段仍須驗證。非照片、非物理模擬、非實機結果。</text>
