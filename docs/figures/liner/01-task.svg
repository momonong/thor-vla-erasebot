<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700">
<title>研究任務：局部展開與對位</title><desc>限定單臂、單片、同材質與可見摺角；不承諾揉團、堆疊或完整包裝線。；概念規劃示意，非實機結果。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52778d"/></marker></defs>
<rect width="1320" height="700" fill="white"/><g font-family="Noto Sans CJK TC, sans-serif">
<text x="45" y="58" font-size="34" fill="#173042" text-anchor="start">研究任務：局部展開與對位</text><text x="45" y="98" font-size="21" fill="#546772" text-anchor="start">限定單臂、單片、同材質與可見摺角；不承諾揉團、堆疊或完整包裝線。</text><rect x="45" y="140" width="365" height="440" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="65" y="176" font-size="25" fill="#173042" text-anchor="start">起始狀態</text><text x="65" y="215" font-size="20" fill="#173042" text-anchor="start">同材質單片襯材</text><text x="65" y="245" font-size="20" fill="#173042" text-anchor="start">一個可見摺角＋小幅偏位</text><rect x="130" y="305" width="170" height="170" fill="none" stroke="#899ca5" stroke-dasharray="8 7"/><path d="M105 320 H230 L285 375 V490 H105 Z" fill="#aac7c0" stroke="#356d63" stroke-width="3"/><path d="M230 320 V375 H285" fill="#e4f0ec" stroke="#356d63" stroke-width="3"/><text x="80" y="545" font-size="18" fill="#173042" text-anchor="start">虛線：固定目標；綠色：概念襯材</text><rect x="470" y="210" width="365" height="300" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="490" y="246" font-size="25" fill="#173042" text-anchor="start">有限閉迴路操作</text><text x="490" y="285" font-size="20" fill="#173042" text-anchor="start">選擇抓邊位置</text><text x="490" y="315" font-size="20" fill="#173042" text-anchor="start">短距離提拉與放下</text><text x="490" y="345" font-size="20" fill="#173042" text-anchor="start">重新觀察後決定下一步</text><text x="490" y="375" font-size="20" fill="#173042" text-anchor="start">未知／超限則停止</text><rect x="895" y="140" width="380" height="440" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="915" y="176" font-size="25" fill="#173042" text-anchor="start">預定目標</text><text x="915" y="215" font-size="20" fill="#173042" text-anchor="start">投影對準固定目標</text><text x="915" y="245" font-size="20" fill="#173042" text-anchor="start">獨立檢查無明顯自重疊</text><rect x="995" y="305" width="170" height="170" fill="#aac7c0" stroke="#356d63" stroke-width="3"/><text x="930" y="545" font-size="18" fill="#173042" text-anchor="start">以既定 protocol 評估，非預示成功</text><path d="M420,360 L449.0,360.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M460,360 L449.0,365.0 L449.0,355.0 Z" fill="#52778d"/><path d="M845,360 L874.0,360.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M885,360 L874.0,365.0 L874.0,355.0 Z" fill="#52778d"/>
<text x="45" y="666" font-size="18" fill="#6f4e29" text-anchor="start">研究規劃／概念示意；材料、尺寸、動作與設備時段仍須驗證。非照片、非物理模擬、非實機結果。</text>
</g></svg>