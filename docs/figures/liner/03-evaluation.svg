<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700">
<title>驗證設計：資料不洩漏，結果不美化</title><desc>現有工具只能評估提供的紀錄；不會自動產生真實照片、量時間或證明來源真實。；概念規劃示意，非實機結果。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52778d"/></marker></defs>
<rect width="1320" height="700" fill="white"/><g font-family="Noto Sans CJK TC, sans-serif">
<text x="45" y="58" font-size="34" fill="#173042" text-anchor="start">驗證設計：資料不洩漏，結果不美化</text><text x="45" y="98" font-size="21" fill="#546772" text-anchor="start">現有工具只能評估提供的紀錄；不會自動產生真實照片、量時間或證明來源真實。</text><rect x="45" y="145" width="360" height="200" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="65" y="181" font-size="25" fill="#173042" text-anchor="start">資料與場次</text><text x="65" y="220" font-size="20" fill="#173042" text-anchor="start">先通過機械可行性關卡</text><text x="65" y="250" font-size="20" fill="#173042" text-anchor="start">規劃30–50段真實示範</text><text x="65" y="280" font-size="20" fill="#173042" text-anchor="start">完整episode／場次分組</text><rect x="475" y="145" width="350" height="200" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="495" y="181" font-size="25" fill="#173042" text-anchor="start">三種方法</text><text x="495" y="220" font-size="20" fill="#173042" text-anchor="start">固定程序</text><text x="495" y="250" font-size="20" fill="#173042" text-anchor="start">持續視覺規則回饋</text><text x="495" y="280" font-size="20" fill="#173042" text-anchor="start">ACT學習策略</text><rect x="895" y="145" width="380" height="200" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="915" y="181" font-size="25" fill="#173042" text-anchor="start">公平執行</text><text x="915" y="220" font-size="20" fill="#173042" text-anchor="start">每種方法獨立重設初態</text><text x="915" y="250" font-size="20" fill="#173042" text-anchor="start">相同時間、循環與判準</text><text x="915" y="280" font-size="20" fill="#173042" text-anchor="start">交錯順序；記錄失敗與介入</text><path d="M415,245 L454.0,245.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M465,245 L454.0,250.0 L454.0,240.0 Z" fill="#52778d"/><path d="M835,245 L874.0,245.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M885,245 L874.0,250.0 L874.0,240.0 Z" fill="#52778d"/><rect x="45" y="410" width="570" height="165" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="65" y="446" font-size="25" fill="#173042" text-anchor="start">48個場景／144列：仍未執行</text><text x="65" y="485" font-size="20" fill="#173042" text-anchor="start">A核心、B尺寸挑戰分開；最終測試不參訓</text><text x="65" y="515" font-size="20" fill="#173042" text-anchor="start">不得將相鄰影格或同一影片拆到不同集合</text><rect x="675" y="410" width="600" height="165" rx="12" fill="#eef4f7" stroke="#7c929f" stroke-width="2"/><text x="695" y="446" font-size="25" fill="#173042" text-anchor="start">批次報告：保留完整結果</text><text x="695" y="485" font-size="20" fill="#173042" text-anchor="start">達標／不達標／證據不足／無效／未執行</text><text x="695" y="515" font-size="20" fill="#173042" text-anchor="start">必要資訊缺失時成功率未知；不刪掉不利紀錄</text><path d="M625,490 L654.0,490.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M665,490 L654.0,495.0 L654.0,485.0 Z" fill="#52778d"/><path d="M1080,355 L1080.0,389.0" fill="none" stroke="#52778d" stroke-width="3"/><path d="M1080,400 L1075.0,389.0 L1085.0,389.0 Z" fill="#52778d"/>
<text x="45" y="666" font-size="18" fill="#6f4e29" text-anchor="start">研究規劃／概念示意；材料、尺寸、動作與設備時段仍須驗證。非照片、非物理模擬、非實機結果。</text>
</g></svg>